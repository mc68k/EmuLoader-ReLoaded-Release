; Main window: text
<p><b>1.</b> Type what you want to search for in the text box and press <b>Enter</b> or click the <b>Apply</b> button.</p><p><b>2.</b> You can search by something else: click the settings button and choose it. Some need a file in <code>arcade\\filters</code>: <code>catver.ini</code> for the category and the version added, <code>languages.ini</code> for the language; <code>nplayers.ini</code> is optional for the number of players.</p><p><b>3.</b> Click the <b>Reset</b> button to clear the search and go back to the tool bar filters.</p><p><b>4.</b> Check <b>Include Tool Bar Filters</b> to search only the games the tool bar filters show (Parent/Clone, Have/Miss, Driver Status, Misc Filters...).</p><p><b>Note</b>: if you change the tool bar filters, apply the search again.</p>=

