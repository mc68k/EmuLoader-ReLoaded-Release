Help=

; Delete Images of Clone Games
How do I use this thing? :)=

; Delete Images of Clone Games: message
Select an image category, then click Start Scan. The clones in the games list (as it's shown, with its filters) that have pictures of their own in that category are listed; pictures in zip files aren't. A new scan always starts a new list.\n\nThen:\n1. Remove from the list the games whose pictures you want to keep: Remove Selected, or the Delete key.\n2. A clone that has pictures when its parent has none can give them to its parent: Rename to Parent.\n3. Delete the pictures of every clone listed (Delete All) or of the selected ones (Delete Selected). They go to the Recycle Bin.\n4. Pick another category and start again.\n\nThe parent's picture is shown under the clone's: when they're the same, the parent's is all you need. Several games can be selected with Ctrl or Shift.=

