; Emulator Settings: message
Video output mode=

; Emulator Settings: message
<b>OpenGL</b> video mode is only supported in SDLMAME and starting from MAME v0.159.<br><b>DirectDraw</b> video mode is only supported in MAME v0.170 and lower versions.<br><br>In doubt, leave this setting in <b>Auto</b>.=

; Emulator Settings: message | Emulator Settings: Save Validate All Custom Files, text
Validate All Custom Files on Save=

; Emulator Settings: message
This feature is used only when saving custom settings.<br><br><b>Disabled / Unchecked</b><br>Custom settings are validated only against emulator default settings (mame.ini; hbmame.ini; ume.ini; emufilename.ini), ignoring all custom files.<br><br><b>Enabled / Checked</b><br>It will keep custom settings files clean and avoid duplicated settings across files. All files will be scanned accordingly (debug.ini; vector.ini; drivername.ini; etc).<br>There's one major downside. Say you have settings in drivername.ini and gamename.ini. Then you decide to delete drivername.ini. All its settings will be lost as they are not listed in later files, forcing you to set them again in gamename.ini.<br><br>In doubt, keep this feature disabled/unchecked.=

; Emulator Settings: message
What each button does?=

; Emulator Settings: message
Button <b>Reload Settings</b> will load a list of custom files one by one, overwriting settings from the previous one. MAME does this when loading games.<br><br>mame.ini; ume.ini; hbmame.ini; emufilename.ini<br>debug.ini<br>vertical.ini (if screen game is vertical)<br>horizont.ini (if screen game is horizontal)<br>arcade.ini (MAME v0.163 and newer)<br>console.ini (MAME v0.163 and newer)<br>computer.ini (MAME v0.163 and newer)<br>othersys.ini (MAME v0.163 and newer)<br>raster.ini (if screen game is raster)<br>vector.ini (if screen game is vector)<br>lcd.ini (if screen game is lcd)<br>svg.ini (if screen game is svg)<br>source\\sourcefile.ini or sourcefile.ini<br>biosname.ini<br>parentgame.ini (if current game is clone)<br>gamename.ini<br><br>Button <b>Reset to Default</b> will only load emulator default settings: mame.ini; ume.ini; hbmame.ini; ignoring everything else.=

