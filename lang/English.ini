; MAME Images Manager: message
Images Manager=

; MAME Images Manager: message
Games With an Image\nClick Scan Category: the games with a valid image in the category are listed, with how many images each one has and where they are; the selected game's image is shown on the right. With Search Clone Images, a clone without an image of its own shows its parent's.\n\nGames With Missing Images\nSelect an image category (Scan Options says which games are scanned) and click Scan Missing Images. To take a snapshot, run the selected game with Enter, a double click or Play in the right-click menu. Remove games from the list with the Delete key or Remove Selected from List; Save Games List To File exports the list to a .txt file.\n\nInvalid Image File Names\nClick Scan Invalid Images: the files in the category's folders that aren't any game's picture are listed on the right. Remove the ones you want to keep from the list (Delete key), then click Delete Invalid Images to delete the others. Files can also be renamed (F2) or moved to another folder.\n\nImages of Games You Don't Have\nClick Images of Games You Don't Have: the games you don't have that have a picture are listed, with the picture on the right. Remove the games whose pictures you want to keep, then click Delete Not Used Images.\n\nDeleted files go to the Recycle Bin.\n\nZip Files\nThe pictures inside the category's zip files (snap.zip, flyers.zip...) are listed too. Deleting, renaming or moving them is written to the zip file all at once: click Apply Zip Changes, or close the window. A new zip file is written and takes the old one's place once it has been checked; the pictures taken out go to the Recycle Bin.\n\nScan All Categories\nCounts the images, the games without an image, the images of games you don't have and the invalid files of every category, with the scan options. Double click a count to list it.\n\nZip Images / Unzip Images\nZip Images puts the category's valid images into a zip file in their folder (snap\\snap.zip), for the category, the games selected in the Scan Category list, or every category. The images are stored as they are; afterwards the folder's copies can go to the Recycle Bin. Unzip Images unpacks the category's zip files into their folders.\n\nIcons (MAMu_)\nThe last category is the MAMu_ icons (the MAMu_ Icons Manager): the same lists and tools for the .ico files of the icons folder and icons.zip. Driver icons and deviceset.ico aren't invalid; the excluded list (right-click the invalid icons) holds icons that never are. Create / Edit Icon (right-click a game) makes a blank icon for it and opens it in your icon editor.=

