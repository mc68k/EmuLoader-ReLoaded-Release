; Miscellaneous Filters
<p>To use these filters, put <b>catver.ini</b> from AntoPISA in the <b>arcade\\filters</b> folder, then restart EmuLoader to load it into the games list.</p><p>You can find catver.ini at AntoPISA's Progetto Snaps: https://www.progettosnaps.net/catver/</p><p>A game is hidden when its category has the words of an unchecked box ("Casino", "Mature" or "Adult" ...). <b>MAME Console Machines</b>, <b>MAME Computer Machines</b> and <b>MAME Handheld Machines</b> show or hide MAME machines only; software lists are not included.</p>=

