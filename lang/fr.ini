Help=Aide

; Export Games Dialog: message
<p>Use this feature to create a <b>.txt</b> file of the current games list. There are three output formats to choose from:</p><p><b>Full Format</b>: suitable for a file viewer or Microsoft Excel. The <b>Game Info To Export</b> settings are only used in this format: you can choose which game info is included, and in what order. Optionally, the file can be made in a format that Excel can import, by checking <b>Microsoft Excel Format</b>.</p><p><b>Short Format</b>: gamename\=system lines, to make favorites profiles quickly, for example.</p><p><b>MAME Content Manager Plus</b>: a file for the MCM+ application, with set names only.</p><p>Each format has three choices:</p><p><b>Export All Games</b>: every game of the list, shown or not. <b>Export All Games</b> (the options panel) chooses which systems and kinds of games are included.<br><b>Export Visible Games</b>: only the games shown in the main games list: set its filters first.<br><b>Export Selected Games</b>: only the games you selected in the main games list.</p><p>All the settings are kept in el_extras.ini, so you won't have to set them again.</p>=<p>Cette fonction crée un fichier <b>.txt</b> de la liste des jeux actuelle. Trois formats de sortie sont proposés :</p><p><b>Format complet</b> : pour une visionneuse de fichiers ou Microsoft Excel. Les réglages <b>Infos de jeu à exporter</b> ne servent que dans ce format : vous choisissez les infos incluses, et leur ordre. Le fichier peut aussi être fait dans un format qu'Excel sait importer, en cochant <b>Format Microsoft Excel</b>.</p><p><b>Format court</b> : des lignes nomdujeu=système, pour créer rapidement des profils de favoris, par exemple.</p><p><b>MAME Content Manager Plus</b> : un fichier pour l'application MCM+, avec les noms de sets seulement.</p><p>Chaque format propose trois choix :</p><p><b>Exporter tous les jeux</b> : tous les jeux de la liste, affichés ou non. Le panneau <b>Exporter tous les jeux</b> choisit les systèmes et les types de jeux inclus.<br><b>Exporter les jeux affichés</b> : seulement les jeux affichés dans la liste principale : réglez d'abord ses filtres.<br><b>Exporter les jeux sélectionnés</b> : seulement les jeux sélectionnés dans la liste principale.</p><p>Tous les réglages sont gardés dans el_extras.ini : vous n'aurez pas à les refaire.</p>

; Export Games Dialog: message | Export MAME and Arcade Games List > Game Info To Export: Game Info To Export Microsoft Excel Format, text
Microsoft Excel Format=Format Microsoft Excel

; Export Games Dialog: message
<p>Makes a games list that Microsoft Excel can <b>Import</b> (Data &gt; From Text/CSV).</p><p>Choose these in Excel:<br>1. <b>Comma</b> as the delimiter<br>2. <b>Double Quote</b> as the text qualifier</p><p>Each value is in double quotes because a text or a number can have a comma in it. A sample:</p><pre>"Title","Year","Game Name","Manufacturer"\n"Ragnagard / Shin-Oh-Ken","1996","ragnagrd","Saurus"\n"Raiden (Rev. A)","1994","raiden","Atari"</pre>=<p>Crée une liste des jeux que Microsoft Excel peut <b>importer</b> (Données &gt; À partir d'un fichier texte/CSV).</p><p>Choisissez dans Excel :<br>1. <b>Virgule</b> comme séparateur<br>2. <b>Guillemet double</b> comme délimiteur de texte</p><p>Chaque valeur est entre guillemets, car un texte ou un nombre peut contenir une virgule. Un exemple :</p><pre>"Title","Year","Game Name","Manufacturer"\n"Ragnagard / Shin-Oh-Ken","1996","ragnagrd","Saurus"\n"Raiden (Rev. A)","1994","raiden","Atari"</pre>

