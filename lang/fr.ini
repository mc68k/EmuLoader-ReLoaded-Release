; Delete Images of Clone Games
How do I use this thing? :)=Comment ça marche ? :)

; Delete Images of Clone Games: message
Select an image category, then click Start Scan. The clones in the games list (as it's shown, with its filters) that have pictures of their own in that category are listed; pictures in zip files aren't. A new scan always starts a new list.\n\nThen:\n1. Remove from the list the games whose pictures you want to keep: Remove Selected, or the Delete key.\n2. A clone that has pictures when its parent has none can give them to its parent: Rename to Parent.\n3. Delete the pictures of every clone listed (Delete All) or of the selected ones (Delete Selected). They go to the Recycle Bin.\n4. Pick another category and start again.\n\nThe parent's picture is shown under the clone's: when they're the same, the parent's is all you need. Several games can be selected with Ctrl or Shift.=Choisissez une catégorie d'images, puis cliquez sur Analyser. Les clones de la liste des jeux (telle qu'affichée, avec ses filtres) qui ont leurs propres images dans cette catégorie sont listés ; les images dans des fichiers zip ne le sont pas. Chaque analyse repart d'une nouvelle liste.\n\nEnsuite :\n1. Retirez de la liste les jeux dont vous voulez garder les images : Retirer la sélection, ou la touche Suppr.\n2. Un clone qui a des images alors que son parent n'en a pas peut les lui donner : Renommer en parent.\n3. Supprimez les images de tous les clones listés (Tout supprimer) ou des jeux choisis (Supprimer la sélection). Elles vont à la corbeille.\n4. Choisissez une autre catégorie et recommencez.\n\nL'image du parent est affichée sous celle du clone : quand elles sont identiques, celle du parent suffit. Ctrl ou Maj permettent de choisir plusieurs jeux.

