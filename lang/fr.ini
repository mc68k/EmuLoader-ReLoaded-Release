<p>To use these filters, put <b>catver.ini</b> from AntoPISA in the <b>arcade\\filters</b> folder, then restart EmuLoader to load it into the games list.</p><p>You can find catver.ini at AntoPISA's Progetto Snaps: https://www.progettosnaps.net/catver/</p><p>A game is hidden when its category has the words of an unchecked box ("Casino", "Mature" or "Adult" ...). <b>MAME Console Machines</b>, <b>MAME Computer Machines</b> and <b>MAME Handheld Machines</b> show or hide MAME machines only; software lists are not included.</p>=<p>Pour utiliser ces filtres, placez le <b>catver.ini</b> d'AntoPISA dans le dossier <b>arcade\\filters</b>, puis redémarrez EmuLoader pour le charger dans la liste des jeux.</p><p>catver.ini se trouve sur Progetto Snaps d'AntoPISA : https://www.progettosnaps.net/catver/</p><p>Un jeu est masqué quand sa catégorie contient les mots d'une case décochée (« Casino », « Mature » ou « Adult » ...). <b>Machines console MAME</b>, <b>Machines ordinateur MAME</b> et <b>Machines portables MAME</b> affichent ou masquent les machines MAME seulement ; les listes de logiciels ne sont pas concernées.</p>

