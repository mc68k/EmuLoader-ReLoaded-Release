; Delete / Copy / Move Selected Games Files: message
Check the files to delete, one by one or by type with the boxes below the list, then click Delete Files.\n\nFiles go to the Recycle Bin, so a mistake can be undone there. Afterwards the games list is updated to show which sets are now missing.\n\nA clone stored in its parent's set (merged) shows the parent's file, unchecked: deleting it removes the parent and all its clones.=Cochez les fichiers à supprimer, un par un ou par type avec les cases sous la liste, puis cliquez sur Supprimer.\n\nLes fichiers vont à la corbeille : une erreur peut donc y être réparée. La liste des jeux montre ensuite les jeux devenus manquants.\n\nUn clone rangé dans le fichier de son parent (fusionné) montre le fichier du parent, non coché : le supprimer retire le parent et tous ses clones.

; Delete / Copy / Move Selected Games Files
Check the files to copy or move, pick the destination folder, then click the button.\n\nROM sets go straight into the folder (or into a folder named after the system with Add System Folder). CHDs go into a folder named after their game, as MAME expects. Existing files are left alone unless Overwrite Files is checked.=Cochez les fichiers à copier ou déplacer, choisissez le dossier de destination, puis cliquez sur le bouton.\n\nLes jeux vont directement dans le dossier (ou dans un dossier au nom du système avec « Ajouter le dossier du système »). Les CHD vont dans un dossier au nom de leur jeu, comme MAME l'attend. Les fichiers déjà présents ne sont pas touchés, sauf si « Remplacer les fichiers » est coché.

