Select the machine types you want to show or hide in the games list.<br><br>The <b>Arcade Systems</b> machine type includes the MAME games.<br><b>MAME Machines With Software Lists</b> are the consoles and computers that run software lists.<br>The <b>MAME Machines Without Software Lists</b> option requires AntoPISA's <b>mess.ini</b> file (in the <b>arcade\\filters</b> folder) to work.<br><b>MAME Software List Games</b> are the games of those lists (Menu Options > MAME/Arcade > Create MAME Software Games List).<br><b>Enable MAME Machines Filter Panel</b> shows the MAME machines with software lists beside the games list: double click one (or press Enter) to list the games it runs.<br><br>Filter settings are saved in <b>ini_files\\games_filters.ini</b>.=Choisissez les types de machines à afficher ou à masquer dans la liste des jeux.<br><br>Le type <b>Systèmes d'arcade</b> comprend les jeux MAME.<br>Les <b>Machines MAME avec listes de logiciels</b> sont les consoles et ordinateurs qui utilisent des listes de logiciels.<br>L'option <b>Machines MAME sans listes de logiciels</b> nécessite le fichier <b>mess.ini</b> d'AntoPISA (dans le dossier <b>arcade\\filters</b>).<br>Les <b>Jeux des listes de logiciels MAME</b> sont les jeux de ces listes (Menu Options > MAME/Arcade > Créer la liste des logiciels MAME).<br><b>Activer le panneau de filtre des machines MAME</b> affiche les machines MAME à listes de logiciels à côté de la liste des jeux : double-cliquez sur l'une d'elles (ou appuyez sur Entrée) pour lister les jeux qu'elle lance.<br><br>Les réglages des filtres sont enregistrés dans <b>ini_files\\games_filters.ini</b>.

