; MAME Images Manager: message
Games With an Image\nClick Scan Category: the games with a valid image in the category are listed, with how many images each one has and where they are; the selected game's image is shown on the right. With Search Clone Images, a clone without an image of its own shows its parent's.\n\nGames With Missing Images\nSelect an image category (Scan Options says which games are scanned) and click Scan Missing Images. To take a snapshot, run the selected game with Enter, a double click or Play in the right-click menu. Remove games from the list with the Delete key or Remove Selected from List; Save Games List To File exports the list to a .txt file.\n\nInvalid Image File Names\nClick Scan Invalid Images: the files in the category's folders that aren't any game's picture are listed on the right. Remove the ones you want to keep from the list (Delete key), then click Delete Invalid Images to delete the others. Files can also be renamed (F2) or moved to another folder.\n\nImages of Games You Don't Have\nClick Images of Games You Don't Have: the games you don't have that have a picture are listed, with the picture on the right. Remove the games whose pictures you want to keep, then click Delete Not Used Images.\n\nDeleted files go to the Recycle Bin.\n\nZip Files\nThe pictures inside the category's zip files (snap.zip, flyers.zip...) are listed too. Deleting, renaming or moving them is written to the zip file all at once: click Apply Zip Changes, or close the window. A new zip file is written and takes the old one's place once it has been checked; the pictures taken out go to the Recycle Bin.\n\nScan All Categories\nCounts the images, the games without an image, the images of games you don't have and the invalid files of every category, with the scan options. Double click a count to list it.\n\nZip Images / Unzip Images\nZip Images puts the category's valid images into a zip file in their folder (snap\\snap.zip), for the category, the games selected in the Scan Category list, or every category. The images are stored as they are; afterwards the folder's copies can go to the Recycle Bin. Unzip Images unpacks the category's zip files into their folders.\n\nIcons (MAMu_)\nThe last category is the MAMu_ icons (the MAMu_ Icons Manager): the same lists and tools for the .ico files of the icons folder and icons.zip. Driver icons and deviceset.ico aren't invalid; the excluded list (right-click the invalid icons) holds icons that never are. Create / Edit Icon (right-click a game) makes a blank icon for it and opens it in your icon editor.=Jeux avec une image\nCliquez sur Analyser la catégorie : les jeux qui ont une image valide dans la catégorie sont listés, avec leur nombre d'images et leur emplacement ; l'image du jeu choisi s'affiche à droite. Avec Chercher les images des clones, un clone sans image à lui affiche celle de son parent.\n\nJeux sans image\nChoisissez une catégorie d'images (Options d'analyse indique quels jeux sont analysés) et cliquez sur Images manquantes. Pour prendre une capture, lancez le jeu choisi avec Entrée, un double clic ou Jouer dans le menu du clic droit. Retirez des jeux de la liste avec la touche Suppr ou Retirer de la liste ; Enregistrer la liste dans un fichier l'exporte en .txt.\n\nNoms de fichiers invalides\nCliquez sur Images invalides : les fichiers des dossiers de la catégorie qui ne sont l'image d'aucun jeu sont listés à droite. Retirez de la liste ceux que vous voulez garder (touche Suppr), puis cliquez sur Supprimer les images invalides pour supprimer les autres. Les fichiers peuvent aussi être renommés (F2) ou déplacés dans un autre dossier.\n\nImages des jeux que vous n'avez pas\nCliquez sur Images des jeux que vous n'avez pas : les jeux que vous n'avez pas et qui ont une image sont listés, avec l'image à droite. Retirez les jeux dont vous voulez garder les images, puis cliquez sur Supprimer les images inutiles.\n\nLes fichiers supprimés vont à la corbeille.\n\nFichiers zip\nLes images contenues dans les fichiers zip de la catégorie (snap.zip, flyers.zip...) sont listées aussi. Leur suppression, leur renommage ou leur déplacement est écrit dans le fichier zip en une seule fois : cliquez sur Appliquer les modifications zip, ou fermez la fenêtre. Un nouveau fichier zip est écrit et ne remplace l'ancien qu'une fois vérifié ; les images retirées vont à la corbeille.\n\nToutes les catégories\nCompte les images, les jeux sans image, les images des jeux que vous n'avez pas et les fichiers invalides de chaque catégorie, avec les options d'analyse. Double-cliquez sur un nombre pour en afficher la liste.\n\nCompresser / Décompresser les images\nCompresser les images met les images valides de la catégorie dans un fichier zip dans leur dossier (snap\\snap.zip), pour la catégorie, les jeux choisis dans la liste d'Analyser la catégorie, ou toutes les catégories. Les images sont stockées telles quelles ; ensuite, les copies du dossier peuvent aller à la corbeille. Décompresser les images extrait les fichiers zip de la catégorie dans leurs dossiers.\n\nIcônes (MAMu_)\nLa dernière catégorie est celle des icônes MAMu_ (le gestionnaire d'icônes MAMu_) : les mêmes listes et outils pour les fichiers .ico du dossier des icônes et de icons.zip. Les icônes des pilotes et deviceset.ico ne sont pas invalides ; la liste d'exclusion (clic droit sur les icônes invalides) contient les icônes qui ne le sont jamais. Créer / modifier l'icône (clic droit sur un jeu) crée une icône vierge pour lui et l'ouvre dans votre éditeur d'icônes.

