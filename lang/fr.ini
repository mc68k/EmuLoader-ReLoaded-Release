; Video Preview Settings: text
Folder=Dossier

; Video Preview Settings: text
Videos=Vidéos

; Video Preview Settings: text
Play a game's video with Shift+V, the Play Video Preview button above the pictures, or the games list's right-click menu.=Lancez la vidéo d'un jeu avec Maj+V, le bouton Lire l'aperçu vidéo au-dessus des images, ou le menu contextuel de la liste des jeux.

; Video Preview Settings
A clone without a video plays its parent's.=Un clone sans vidéo lit celle de son parent.

; Video Preview Settings: text
System=Système

; Video Preview Settings: text
A folder inside EmuLoader's folder can be given as a relative path; network paths aren't supported, and subfolders aren't searched.=Un dossier situé dans celui d'EmuLoader peut être indiqué par un chemin relatif ; les chemins réseau ne sont pas pris en charge et les sous-dossiers ne sont pas parcourus.

; Video Preview Settings
Videos that aren't in the folder (or all of them, with no folder) are also looked for in a videosnaps folder inside the emulator's folder, in a videosnaps folder inside the snapshot folder, and with the snapshots themselves.=Les vidéos absentes du dossier (ou toutes, sans dossier) sont aussi cherchées dans un dossier videosnaps de l'émulateur, dans un dossier videosnaps du dossier des captures, et avec les captures elles-mêmes.

; Video Preview Settings
Sound=Son

; Video Preview Settings
Play Again When It Ends=Rejouer à la fin

; Video Preview Settings: text
EmuLoader's player is ready.=Le lecteur d'EmuLoader est prêt.

; Video Preview Settings: text
EmuLoader's player is ready (mpv %1, %2).=Le lecteur d'EmuLoader est prêt (mpv %1, %2).

; Video Preview Settings: text
EmuLoader's player can't play videos: %1 isn't in EmuLoader's folder. It comes with EmuLoader; put it back from the download, or use another media player (Advanced, below).=Le lecteur d'EmuLoader ne peut pas lire de vidéos : %1 n'est pas dans le dossier d'EmuLoader. Il est fourni avec EmuLoader ; remettez-le à partir du téléchargement, ou utilisez un autre lecteur multimédia (Avancé, ci-dessous).

; Video Preview Settings: text
Volume=Volume

; Video Preview Settings: text
Video Player=Lecteur vidéo

; Video Preview Settings: text
To watch the videos as you go through the games, turn a picture panel to Video: with the mouse wheel or the category button (Video comes after Game Snapshot), or for a panel of a layout in Settings > Layouts.=Pour regarder les vidéos en parcourant les jeux, passez un panneau d'images sur Vidéo : avec la molette de la souris ou le bouton de catégorie (Vidéo vient après Capture en jeu), ou pour un panneau d'une disposition dans Paramètres > Dispositions.

; Video Preview Settings
Off: the snapshot shows again when the video ends.=Décoché : la capture réapparaît à la fin de la vidéo.

; Video Preview Settings
Shift+V or the Play Video Preview button plays the video in any category, over the snapshot. Click the video or press Shift+V to stop it, and right-click it to open it in your media player.=Maj+V ou le bouton Lire l'aperçu vidéo lit la vidéo dans n'importe quelle catégorie, par-dessus la capture. Cliquez sur la vidéo ou appuyez sur Maj+V pour l'arrêter, et faites un clic droit dessus pour l'ouvrir dans votre lecteur multimédia.

; Video Preview Settings: text
Advanced: Use Another Media Player=Avancé : utiliser un autre lecteur multimédia

; Video Preview Settings: text
Play the videos in this media player instead=Lire plutôt les vidéos dans ce lecteur multimédia

; Video Preview Settings
This player opens the videos in its own window: they never play in EmuLoader's picture panel, and EmuLoader can't stop or close it. Unchecked, it's only used by Open in... in the video's right-click menu (and when EmuLoader's player can't play).=Ce lecteur ouvre les vidéos dans sa propre fenêtre : elles ne sont jamais lues dans le panneau d'images d'EmuLoader, et EmuLoader ne peut ni l'arrêter ni le fermer. Décoché, il n'est utilisé que par Ouvrir dans... dans le menu du clic droit de la vidéo (et quand le lecteur d'EmuLoader ne peut pas lire).

; Video Preview Settings: text
Media Player=Lecteur multimédia

; Video Preview Settings: text
Parameters=Paramètres

; Video Preview Settings: text
Dummy Video Parameters=Paramètres de la vidéo factice

; Video Preview Settings: text
Another Media Player=Autre lecteur multimédia

; Video Preview Settings: text
Auto Play=Lecture automatique

; Video Preview Settings
Any media player works, for example MPC-HC or VLC media player, and so does a batch file (.bat, .cmd). The parameters of known players come from ini_files\\videopreview.ini.=N'importe quel lecteur convient, par exemple MPC-HC ou VLC, ainsi qu'un fichier de commandes (.bat, .cmd). Les paramètres des lecteurs connus viennent de ini_files\\videopreview.ini.

; Video Preview Settings
%1 is replaced by the video file (in quotes). Include the player's switch to close when the video ends.=%1 est remplacé par le fichier vidéo (entre guillemets). Ajoutez l'option du lecteur qui le ferme à la fin de la vidéo.

; Video Preview Settings
Starts this player when you select a game that has a video. Depending on the player, selecting other games while a video plays can cause trouble: close it with its keyboard shortcut.=Démarre ce lecteur quand vous sélectionnez un jeu qui a une vidéo. Selon le lecteur, sélectionner d'autres jeux pendant la lecture peut poser problème : fermez-le avec son raccourci clavier.

; Video Preview Settings
When you select a game without a video, a very short video (resources\\images\\novideo.avi) plays to stop the one playing, as EmuLoader can't close the player.=Quand vous sélectionnez un jeu sans vidéo, une vidéo très courte (resources\\images\\novideo.avi) est lue pour arrêter celle en cours, car EmuLoader ne peut pas fermer le lecteur.

; Video Preview Settings
Empty: the media player's parameters are used. %1 is optional here.=Vide : les paramètres du lecteur sont utilisés. %1 est facultatif ici.

; Video Preview Settings
Video previews of the games: where the videos are, and how they play.=Aperçus vidéo des jeux : où sont les vidéos, et comment elles sont lues.

