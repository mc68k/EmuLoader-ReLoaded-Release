<b>OpenGL</b> video mode is only supported in SDLMAME and starting from MAME v0.159.<br><b>DirectDraw</b> video mode is only supported in MAME v0.170 and lower versions.<br><br>In doubt, leave this setting in <b>Auto</b>.=Le mode vidéo <b>OpenGL</b> n'est pris en charge que par SDLMAME et à partir de MAME v0.159.<br>Le mode vidéo <b>DirectDraw</b> n'est pris en charge que jusqu'à MAME v0.170.<br><br>Dans le doute, laissez ce réglage sur <b>Auto</b>.

; Emulator Settings: message | Emulator Settings: Save Validate All Custom Files, text
Validate All Custom Files on Save=Valider tous les fichiers personnalisés à l'enregistrement

; Emulator Settings: message
This feature is used only when saving custom settings.<br><br><b>Disabled / Unchecked</b><br>Custom settings are validated only against emulator default settings (mame.ini; hbmame.ini; ume.ini; emufilename.ini), ignoring all custom files.<br><br><b>Enabled / Checked</b><br>It will keep custom settings files clean and avoid duplicated settings across files. All files will be scanned accordingly (debug.ini; vector.ini; drivername.ini; etc).<br>There's one major downside. Say you have settings in drivername.ini and gamename.ini. Then you decide to delete drivername.ini. All its settings will be lost as they are not listed in later files, forcing you to set them again in gamename.ini.<br><br>In doubt, keep this feature disabled/unchecked.=Cette fonction ne sert qu'à l'enregistrement des réglages personnalisés.<br><br><b>Désactivée / décochée</b><br>Les réglages personnalisés ne sont comparés qu'aux réglages par défaut de l'émulateur (mame.ini ; hbmame.ini ; ume.ini ; emufilename.ini), sans tenir compte des fichiers personnalisés.<br><br><b>Activée / cochée</b><br>Les fichiers de réglages personnalisés restent propres, sans réglages en double d'un fichier à l'autre. Tous les fichiers sont analysés en conséquence (debug.ini ; vector.ini ; drivername.ini ; etc.).<br>Il y a un inconvénient majeur. Supposons que vous ayez des réglages dans drivername.ini et gamename.ini, puis que vous supprimiez drivername.ini. Tous ses réglages sont perdus, car ils ne figurent pas dans les fichiers suivants, et vous devez les refaire dans gamename.ini.<br><br>Dans le doute, laissez cette fonction désactivée/décochée.

; Emulator Settings: message
What each button does?=À quoi sert chaque bouton ?

; Emulator Settings: message
Button <b>Reload Settings</b> will load a list of custom files one by one, overwriting settings from the previous one. MAME does this when loading games.<br><br>mame.ini; ume.ini; hbmame.ini; emufilename.ini<br>debug.ini<br>vertical.ini (if screen game is vertical)<br>horizont.ini (if screen game is horizontal)<br>arcade.ini (MAME v0.163 and newer)<br>console.ini (MAME v0.163 and newer)<br>computer.ini (MAME v0.163 and newer)<br>othersys.ini (MAME v0.163 and newer)<br>raster.ini (if screen game is raster)<br>vector.ini (if screen game is vector)<br>lcd.ini (if screen game is lcd)<br>svg.ini (if screen game is svg)<br>source\\sourcefile.ini or sourcefile.ini<br>biosname.ini<br>parentgame.ini (if current game is clone)<br>gamename.ini<br><br>Button <b>Reset to Default</b> will only load emulator default settings: mame.ini; ume.ini; hbmame.ini; ignoring everything else.=Le bouton <b>Recharger les réglages</b> charge une liste de fichiers personnalisés l'un après l'autre, chacun remplaçant les réglages du précédent. MAME fait de même au chargement des jeux.<br><br>mame.ini ; ume.ini ; hbmame.ini ; emufilename.ini<br>debug.ini<br>vertical.ini (si l'écran du jeu est vertical)<br>horizont.ini (si l'écran du jeu est horizontal)<br>arcade.ini (MAME v0.163 et suivants)<br>console.ini (MAME v0.163 et suivants)<br>computer.ini (MAME v0.163 et suivants)<br>othersys.ini (MAME v0.163 et suivants)<br>raster.ini (si l'écran du jeu est matriciel)<br>vector.ini (si l'écran du jeu est vectoriel)<br>lcd.ini (si l'écran du jeu est LCD)<br>svg.ini (si l'écran du jeu est SVG)<br>source\\sourcefile.ini ou sourcefile.ini<br>biosname.ini<br>parentgame.ini (si le jeu est un clone)<br>gamename.ini<br><br>Le bouton <b>Réglages par défaut</b> ne charge que les réglages par défaut de l'émulateur : mame.ini ; ume.ini ; hbmame.ini, sans tenir compte du reste.

